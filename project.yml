name: Zeta
options:
  bundleIdPrefix: com.zeta
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    PRODUCT_NAME: Zeta

targets:
  Zeta:
    type: application
    platform: macOS
    sources:
      - path: Zeta
        excludes:
          - "**/.DS_Store"
      - path: Zeta/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Zeta/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.zeta.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Zeta/Zeta.entitlements
      properties:
        com.apple.security.app-sandbox: false

schemes:
  Zeta:
    build:
      targets:
        Zeta: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
